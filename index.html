<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;color:#eee}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Press Start 2P",monospace;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;height:calc(100% - 66px);aspect-ratio:470/660;max-width:100%}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#msg{position:absolute;left:0;right:0;top:56%;text-align:center;font-size:11px;line-height:1.9;color:#eee;pointer-events:none;padding:0 40px}
#msg small{font-size:7px;color:#999}
.perfect{display:block;white-space:nowrap;font-size:14px;margin-bottom:6px;color:#ffd400;text-shadow:3px 3px 0 #c00;animation:pf .35s steps(2,jump-none) infinite}
@keyframes pf{0%{color:#ffd400;transform:scale(1)}100%{color:#fff;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.perfect{animation:none}}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.94);overflow-y:auto;touch-action:pan-y;padding:12px 0}
#menu h1{font-size:30px;letter-spacing:4px;margin:0 0 10px;font-weight:400}
#menu p{font-size:8px;color:#999;margin:6px 0 2px}
#menu button{font:inherit;font-size:10px;background:#000;color:#f2f2f2;border:3px solid #f2f2f2;border-radius:0;padding:9px 6px;width:min(260px,80%);cursor:pointer}
#menu button:hover,#menu button:focus-visible{background:#f2f2f2;color:#000;outline:none}
footer{display:flex;align-items:center;gap:8px;width:100%;height:66px;padding:4px max(14px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom));flex:none}
footer a{flex:none;width:48px;height:48px;border-radius:50%;background:#f2f2f2;color:#000;font:700 26px/46px system-ui,sans-serif;text-align:center;text-decoration:none;box-shadow:0 3px 0 rgba(255,255,255,.25)}
footer a:active{transform:translateY(2px)}
footer a:focus-visible{outline:3px solid #f2f2f2;outline-offset:2px}
#hint{flex:1;text-align:center;font-size:8px;line-height:1.6;color:#888}
#btnMenu{flex:none;font:inherit;font-size:8px;background:transparent;color:#f2f2f2;border:2px solid #888;padding:9px 8px;cursor:pointer}
#btnMenu:hover,#btnMenu:focus-visible{background:#f2f2f2;color:#000;outline:none}
</style>
</head>
<body>
<div id="wrap">
 <canvas id="c" width="470" height="660"></canvas>
 <div id="msg"></div>
 <div id="menu">
  <h1>PONG</h1>
  <p>CONTRA A MÁQUINA</p>
  <button data-m="1" data-l="1">1 · INICIANTE</button>
  <button data-m="1" data-l="2">2 · FÁCIL</button>
  <button data-m="1" data-l="3">3 · MÉDIO</button>
  <button data-m="1" data-l="4">4 · DIFÍCIL</button>
  <button data-m="1" data-l="5">5 · MESTRE</button>
  <p>OU</p>
  <button data-m="2">2 JOGADORES</button>
</div>
</div>
<footer><a href="https://phfcuditablet.github.io/jogos/" aria-label="Voltar para a página dos jogos" title="Voltar">←</a><div id="hint"></div><button id="btnMenu">MENU</button></footer>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg'),menu=document.getElementById('menu'),hint=document.getElementById('hint');
const W=470,H=660,L=68,R=398,PW=50,PH=14,TOP_Y=50,BOT_Y=600,B=10,WIN=11;
const D={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111'};
// níveis da máquina: s = velocidade da raquete, e = margem de erro de mira (px)
const LV={1:{s:1.7,e:42},2:{s:2.5,e:28},3:{s:3.4,e:16},4:{s:4.6,e:7},5:{s:6.5,e:0}};
let mode=1,lv=3,aiOff=0,you=0,cpu=0,state='menu',px=(L+R)/2-PW/2,ax=px,bx,by,vx,vy,sp,keys={},ptr=new Map(),last=0,acc=0,serveDir=1,timer=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function digits(n,xr,y,s){const str=String(n);let x=xr-str.length*(3*s)-(str.length-1)*s;
 for(const ch of str){const m=D[ch];for(let i=0;i<15;i++)if(m[i]==='1')ctx.fillRect(x+(i%3)*s,y+Math.floor(i/3)*s,s,s);x+=4*s}}
function serve(){bx=(L+R)/2-B/2;by=H/2-B/2;sp=4.2;const a=(Math.random()*0.8-0.4);vx=Math.sin(a)*sp;vy=Math.cos(a)*sp*serveDir;aiOff=(Math.random()*2-1)*LV[lv].e}
function show(t){msg.innerHTML=t;msg.style.display=t?'block':'none'}
function openMenu(){clearTimeout(timer);state='menu';show('');menu.style.display='flex';hint.textContent='escolha o modo de jogo'}
function newGame(m,l){mode=m;lv=l||lv;clearTimeout(timer);you=0;cpu=0;px=ax=(L+R)/2-PW/2;serveDir=Math.random()<.5?1:-1;serve();state='ready';menu.style.display='none';
 hint.textContent=m===1?'setas ou arraste · 1º a 11':'J1: ← → · J2: A D · 1º a 11';show('TOQUE OU<br>ESPAÇO')}
function start(){if(state==='ready'){state='play';show('')}else if(state==='over')openMenu()}
function point(by_you){by_you?you++:cpu++;serveDir=by_you?-1:1;serve();
 if(you>=WIN||cpu>=WIN){state='over';const y=you>=WIN,pf=y?cpu===0:you===0;
  show((pf?'<span class="perfect">PERFECT!!!</span>':'')+(mode===1?(y?'VOCÊ<br>VENCEU':'A MÁQUINA<br>VENCEU'):(y?'JOGADOR 1<br>VENCEU':'JOGADOR 2<br>VENCEU'))+'<br><br><small>toque para o menu</small>')}
 else{state='ready';timer=setTimeout(()=>{if(state==='ready')state='play'},700)}}
function ptrTarget(top){let t=null;for(const p of ptr.values()){const isTop=mode===2&&p.y<H/2;if(isTop===top)t=p.x}return t}
function move(p,dx,t){if(t!==null)dx=clamp(t-PW/2-p,-9,9);return clamp(p+dx,L+8,R-8-PW)}
function step(){
 let bl=(keys.arrowleft?-6:0)+(keys.arrowright?6:0);
 if(mode===1)bl+=(keys.a?-6:0)+(keys.d?6:0);
 px=move(px,bl,ptrTarget(false));
 if(mode===2)ax=move(ax,(keys.a?-6:0)+(keys.d?6:0),ptrTarget(true));
 if(state!=='play')return;
 if(mode===1){ // máquina
  const c=ax+PW/2,s=LV[lv].s;let t;
  if(vy<0&&(lv>=3||by<H/2+60))t=bx+B/2+aiOff;else t=lv>=3?(L+R)/2:c;
  const d=t-c;if(Math.abs(d)>2)ax=clamp(ax+clamp(d,-s,s),L+8,R-8-PW);
 }
 bx+=vx;by+=vy;
 if(bx<L+8){bx=L+8;vx=Math.abs(vx)}
 if(bx+B>R-8){bx=R-8-B;vx=-Math.abs(vx)}
 if(vy>0&&by+B>=BOT_Y&&by+B<=BOT_Y+PH+vy+2&&bx+B>px&&bx<px+PW)hit(px,-1);
 else if(vy<0&&by<=TOP_Y+PH&&by>=TOP_Y-vy-2&&bx+B>ax&&bx<ax+PW)hit(ax,1);
 if(by>H-20)point(false);else if(by<30)point(true);
}
function hit(p,dir){const rel=((bx+B/2)-(p+PW/2))/(PW/2);sp=Math.min(sp+0.35,9);
 const a=rel*1.0;vx=Math.sin(a)*sp;vy=Math.cos(a)*sp*dir;
 by=dir<0?BOT_Y-B:TOP_Y+PH;if(dir<0)aiOff=(Math.random()*2-1)*LV[lv].e}
function draw(){
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f2f2f2';
 ctx.fillRect(60,50,8,565);ctx.fillRect(398,50,8,565);
 for(let x=75;x<392;x+=17)ctx.fillRect(x,326,10,12);
 ctx.fillRect(ax,TOP_Y,PW,PH);ctx.fillRect(px,BOT_Y,PW,PH);
 ctx.fillRect(bx,by,B,B);
 digits(cpu,382,276,8);digits(you,382,350,8);
}
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('footer,#menu'))return;
 const k=e.key.toLowerCase();
 if(k==='escape'){openMenu();return}
 if(k===' '||k==='enter'){e.preventDefault();start()}
 keys[k]=true;if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,pos(e));start()});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'?(mode===1||e.buttons):ptr.has(e.pointerId))ptr.set(e.pointerId,pos(e))});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')ptr.delete(e.pointerId)});
addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'||mode===2)ptr.delete(e.pointerId)});
addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
menu.addEventListener('click',e=>{const b=e.target.closest('button');if(b)newGame(+b.dataset.m,+b.dataset.l||0)});
document.getElementById('btnMenu').addEventListener('click',openMenu);
serve();openMenu();requestAnimationFrame(t=>{last=t;loop(t)});
</script>
</body>
</html>
